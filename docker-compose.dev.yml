# Opcional: banco externo para desenvolvimento. O perfil dev da API usa H2 por padrão.
# Ao optar por PostgreSQL, configure SPRING_DATASOURCE_URL/USERNAME/PASSWORD
# e SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver no backend local.
name: supercursos-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supercursos_dev
      POSTGRES_USER: ${POSTGRES_USER:-supercursos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supercursos_local}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_dev:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_local}
    ports:
      - "127.0.0.1:${DEV_PGADMIN_PORT:-5052}:80"
    volumes:
      - pgadmin_dev:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev:
  pgadmin_dev:
