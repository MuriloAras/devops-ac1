name: supercursos-homol

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supercursos_homol}
      POSTGRES_USER: ${POSTGRES_USER:-supercursos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supercursos_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_homol:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_local}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_homol:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=3)"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: supercursos-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: homol
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-supercursos_homol}
      DB_USER: ${POSTGRES_USER:-supercursos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-supercursos_local}
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    image: supercursos-ai:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_homol:/mosquitto/data

  mqtt-gateway:
    build:
      context: ./mqtt-gateway
    image: supercursos-mqtt-gateway:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      CORE_EVENTS_URL: http://api:8080/api/eventos-aprendizagem
    ports:
      - "127.0.0.1:${MQTT_METRICS_PORT:-9101}:9101"
    depends_on:
      mosquitto:
        condition: service_started
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: supercursos-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3002}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '^OK$'"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9092}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_homol:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_homol:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      - prometheus

  cypress:
    image: cypress/included:14.5.4
    profiles: ["e2e"]
    working_dir: /e2e
    environment:
      CYPRESS_BASE_URL: http://frontend:80
      CYPRESS_VIDEO: "true"
    volumes:
      - ./frontend:/e2e
    shm_size: 1gb
    depends_on:
      frontend:
        condition: service_healthy
    entrypoint: ["cypress", "run"]

  ai-test:
    image: supercursos-ai:${IMAGE_TAG:-local}
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./target/b1-python-reports:/reports
    command: ["sh", "-c", "python -m unittest discover -s tests > /reports/ai-tests.txt 2>&1; result=$$?; cat /reports/ai-tests.txt; exit $$result"]

  mqtt-gateway-test:
    image: supercursos-mqtt-gateway:${IMAGE_TAG:-local}
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./target/b1-python-reports:/reports
    command: ["sh", "-c", "python -m unittest discover -s . -p test_app.py > /reports/mqtt-gateway-tests.txt 2>&1; result=$$?; cat /reports/mqtt-gateway-tests.txt; exit $$result"]

volumes:
  postgres_homol:
  pgadmin_homol:
  prometheus_homol:
  grafana_homol:
  mosquitto_homol:
