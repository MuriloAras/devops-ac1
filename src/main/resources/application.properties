spring.application.name=supercursos
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.check-template-location=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
supercursos.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
supercursos.notificacoes.ativas=${NOTIFICATIONS_ENABLED:true}
supercursos.outbox.intervalo-ms=${OUTBOX_INTERVAL_MS:2000}
